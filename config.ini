# ============================================================
# BOOKING REPORT AUTOMATION — MASTER CONFIGURATION FILE
# ============================================================

[PATHS]
downloads_source_folder = /tmp/booking_downloads
root_output_folder      = /tmp/booking_reports
store_file_name         = Processed_Booking_Numbers.csv

[DOWNLOADER]
login_url         = https://wisx.aaveg.co.in
report_url        = https://wisx.aaveg.co.in/Report/BKG_501_BookingBetweenDates?rptid_c=1
change_fiscal_url = https://wisx.aaveg.co.in/Home/ChangeFiscal
logout_url        = https://wisx.aaveg.co.in/Account/Logout

# Injected at runtime from GitHub Secrets
user_id           = ${WISX_USER_ID}
password          = ${WISX_PASSWORD}

branch_id         = 1
headless          = True

[SMTP]
smtp_host         = smtp.gmail.com
smtp_port         = 587
use_tls           = True

# Injected at runtime from GitHub Secrets
sender_email      = ${SMTP_SENDER_EMAIL}
sender_password   = ${SMTP_SENDER_PASSWORD}
sender_name       = Booking Report

[EMAIL_LINKEDIN]
subject = Daily Booking Report - LinkedIn - {date}
to      = ${EMAIL_LINKEDIN_TO}
cc      = ${EMAIL_LINKEDIN_CC}
bcc     =

[EMAIL_BTC]
subject = Daily Booking Report - BTC - {date}
to      = ${EMAIL_BTC_TO}
cc      = ${EMAIL_BTC_CC}
bcc     =

[EMAIL_NONBTC]
subject = Daily Booking Report - Non BTC - {date}
to      = ${EMAIL_NONBTC_TO}
cc      = ${EMAIL_NONBTC_CC}
bcc     =

[EMAIL_SETTINGS]
retry_attempts  = 3
retry_delay_sec = 10
send_if_empty   = False

[SCHEDULE]
scheduled_time  = 09:00