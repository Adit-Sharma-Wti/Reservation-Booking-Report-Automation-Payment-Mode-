# ============================================================
# WORKFLOW 2 — PROCESS DATA & SEND EMAILS
# .github/workflows/email.yml
# Runs at 7:00 AM IST = 01:30 AM UTC
# ============================================================

name: Process and Send Email Reports

on:
  schedule:
    - cron: '30 1 * * *'    # 7:00 AM IST
  workflow_dispatch:         # Manual trigger

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Create Working Directories
        run: |
          mkdir -p /tmp/booking_downloads
          mkdir -p store

      - name: Find Latest Download Run ID
        id: find_run
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              workflow_id: 'download.yml',
              status:      'success',
              per_page:    5,
            });

            if (runs.data.workflow_runs.length === 0) {
              core.setFailed('❌ No successful download runs found.');
              return;
            }

            const latestRun = runs.data.workflow_runs[0];

            // ── Check if download ran TODAY ──────────────────
            const runDate    = new Date(latestRun.created_at);
            const today      = new Date();
            const isSameDay  = (
              runDate.getUTCFullYear() === today.getUTCFullYear() &&
              runDate.getUTCMonth()    === today.getUTCMonth()    &&
              runDate.getUTCDate()     === today.getUTCDate()
            );

            console.log(`✅ Latest download run ID : ${latestRun.id}`);
            console.log(`   Created at             : ${latestRun.created_at}`);
            console.log(`   Ran today              : ${isSameDay}`);

            if (!isSameDay) {
              console.log(
                '⚠️  WARNING: Latest download run is NOT from today.'
              );
              console.log(
                '   Using most recent successful run anyway...'
              );
            }

            core.setOutput('run_id',    latestRun.id.toString());
            core.setOutput('same_day',  isSameDay.toString());
            core.setOutput('run_date',  latestRun.created_at);

      - name: Download Booking Data Artifact
        uses: actions/download-artifact@v4
        with:
          name:         booking-data-latest
          path:         /tmp/artifact/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository:   ${{ github.repository }}
          run-id:       ${{ steps.find_run.outputs.run_id }}

      - name: Restore Downloaded Files
        run: |
          echo "📂 Artifact contents:"
          ls -la /tmp/artifact/

          if [ -d "/tmp/artifact/booking_downloads" ]; then
            cp -r /tmp/artifact/booking_downloads/. /tmp/booking_downloads/
            echo "✅ Booking files restored"
            ls -la /tmp/booking_downloads/
          else
            echo "❌ booking_downloads not found"
            find /tmp/artifact/ -type f
            exit 1
          fi

          if [ -f "/tmp/artifact/handoff.json" ]; then
            cp /tmp/artifact/handoff.json /tmp/handoff.json
            echo "✅ Handoff restored:"
            cat /tmp/handoff.json
          else
            echo "❌ handoff.json not found"
            exit 1
          fi

      - name: Show Current Store Structure
        run: |
          echo "📂 Current store folder:"
          find store/ -type f 2>/dev/null || echo "Store is empty"

      - name: Run Process and Email Step
        env:
          WISX_USER_ID:         ${{ secrets.WISX_USER_ID }}
          WISX_PASSWORD:        ${{ secrets.WISX_PASSWORD }}
          SMTP_SENDER_EMAIL:    ${{ secrets.SMTP_SENDER_EMAIL }}
          SMTP_SENDER_PASSWORD: ${{ secrets.SMTP_SENDER_PASSWORD }}
          EMAIL_LINKEDIN_TO:    ${{ secrets.EMAIL_LINKEDIN_TO }}
          EMAIL_LINKEDIN_CC:    ${{ secrets.EMAIL_LINKEDIN_CC }}
          EMAIL_BTC_TO:         ${{ secrets.EMAIL_BTC_TO }}
          EMAIL_BTC_CC:         ${{ secrets.EMAIL_BTC_CC }}
          EMAIL_NONBTC_TO:      ${{ secrets.EMAIL_NONBTC_TO }}
          EMAIL_NONBTC_CC:      ${{ secrets.EMAIL_NONBTC_CC }}
        run: python email_master.py

      - name: Show Updated Store Structure
        run: |
          echo "📂 Updated store folder:"
          find store/ -type f 2>/dev/null
          echo ""
          echo "📊 Processed Booking Numbers Count:"
          find store/ -name "Processed_Booking_Numbers.csv" \
          | while read f; do
            echo "$f → $(wc -l < $f) bookings"
          done

      - name: Commit Store and Reports Back to Repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add store/
          if git diff --staged --quiet; then
            echo "✅ No changes to commit"
          else
            git commit -m "🔄 Daily Update - $(date +'%d-%b-%Y %H:%M') IST"
            git push
            echo "✅ Pushed to repo"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
