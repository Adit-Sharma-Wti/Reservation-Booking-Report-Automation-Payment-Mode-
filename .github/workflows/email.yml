# ============================================================
# WORKFLOW 2 — PROCESS DATA & SEND EMAILS
# .github/workflows/email.yml
# ============================================================

name: Process and Send Email Reports

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # ── 1. Checkout with write permission ─────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Create Working Directories
        run: |
          mkdir -p /tmp/booking_downloads
          mkdir -p store

      - name: Find Latest Download Run ID
        id: find_run
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              workflow_id: 'download.yml',
              status:      'success',
              per_page:    5,
            });
            if (runs.data.workflow_runs.length === 0) {
              core.setFailed('❌ No successful download runs found.');
              return;
            }
            const latestRun = runs.data.workflow_runs[0];
            console.log(`✅ Found run ID: ${latestRun.id}`);
            core.setOutput('run_id', latestRun.id.toString());

      - name: Download Booking Data Artifact
        uses: actions/download-artifact@v4
        with:
          name:         booking-data-latest
          path:         /tmp/artifact/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository:   ${{ github.repository }}
          run-id:       ${{ steps.find_run.outputs.run_id }}

      - name: Restore Downloaded Files
        run: |
          echo "📂 Artifact contents:"
          ls -la /tmp/artifact/

          if [ -d "/tmp/artifact/booking_downloads" ]; then
            cp -r /tmp/artifact/booking_downloads/. /tmp/booking_downloads/
            echo "✅ Booking files restored"
            ls -la /tmp/booking_downloads/
          else
            echo "❌ booking_downloads not found"
            find /tmp/artifact/ -type f
            exit 1
          fi

          if [ -f "/tmp/artifact/handoff.json" ]; then
            cp /tmp/artifact/handoff.json /tmp/handoff.json
            echo "✅ Handoff restored:"
            cat /tmp/handoff.json
          else
            echo "❌ handoff.json not found"
            exit 1
          fi

      # ── Show current store structure ───────────────────────
      - name: Show Current Store Structure
        run: |
          echo "📂 Current store folder:"
          find store/ -type f 2>/dev/null || echo "Store is empty"

      - name: Run Process and Email Step
        env:
          WISX_USER_ID:         ${{ secrets.WISX_USER_ID }}
          WISX_PASSWORD:        ${{ secrets.WISX_PASSWORD }}
          SMTP_SENDER_EMAIL:    ${{ secrets.SMTP_SENDER_EMAIL }}
          SMTP_SENDER_PASSWORD: ${{ secrets.SMTP_SENDER_PASSWORD }}
          EMAIL_LINKEDIN_TO:    ${{ secrets.EMAIL_LINKEDIN_TO }}
          EMAIL_LINKEDIN_CC:    ${{ secrets.EMAIL_LINKEDIN_CC }}
          EMAIL_BTC_TO:         ${{ secrets.EMAIL_BTC_TO }}
          EMAIL_BTC_CC:         ${{ secrets.EMAIL_BTC_CC }}
          EMAIL_NONBTC_TO:      ${{ secrets.EMAIL_NONBTC_TO }}
          EMAIL_NONBTC_CC:      ${{ secrets.EMAIL_NONBTC_CC }}
        run: python email_master.py

      # ── Show what was created ──────────────────────────────
      - name: Show Updated Store Structure
        run: |
          echo "📂 Updated store folder:"
          find store/ -type f 2>/dev/null
          echo ""
          echo "📊 Processed Booking Numbers Count:"
          find store/ -name "Processed_Booking_Numbers.csv" | while read f; do
            echo "$f → $(wc -l < $f) bookings"
          done

      # ── Commit everything back to repo ────────────────────
      - name: Commit Store & Reports Back to Repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage all store files
          git add store/

          # Check if anything changed
          if git diff --staged --quiet; then
            echo "✅ No changes to commit"
          else
            echo "📝 Changes detected — committing..."
            git commit -m "🔄 Daily Update - $(date +'%d-%b-%Y %H:%M') IST"
            git push
            echo "✅ Store committed and pushed to repo"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
