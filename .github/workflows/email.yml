# ============================================================
# WORKFLOW 2 — PROCESS DATA & SEND EMAILS
# .github/workflows/email.yml
# Runs at 7:00 AM IST = 01:30 AM UTC
# ============================================================

name: Process and Send Email Reports

on:
  schedule:
    - cron: '30 1 * * *'    # 1:30 AM UTC = 7:00 AM IST
  workflow_dispatch:         # Manual trigger

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # ── 1. Checkout code ───────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Setup Python ────────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Cache pip packages ──────────────────────────────
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── 4. Install Python dependencies ─────────────────────
      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      # ── 5. Create temp directories ─────────────────────────
      - name: Create Working Directories
        run: |
          mkdir -p /tmp/booking_downloads
          mkdir -p /tmp/booking_reports

      # ── 6. Find latest download workflow run ID ────────────
      - name: Find Latest Download Run ID
        id: find_run
        uses: actions/github-script@v7
        with:
          script: |
            // Get list of runs for the download workflow
            const runs = await github.rest.actions.listWorkflowRuns({
              owner:         context.repo.owner,
              repo:          context.repo.repo,
              workflow_id:   'download.yml',
              status:        'success',
              per_page:      5,
            });

            if (runs.data.workflow_runs.length === 0) {
              core.setFailed(
                '❌ No successful download workflow runs found. ' +
                'Please run the Download workflow first.'
              );
              return;
            }

            // Pick the most recent successful run
            const latestRun = runs.data.workflow_runs[0];
            console.log(`✅ Found download run ID: ${latestRun.id}`);
            console.log(`   Run name   : ${latestRun.name}`);
            console.log(`   Created at : ${latestRun.created_at}`);
            console.log(`   Status     : ${latestRun.status}`);

            core.setOutput('run_id', latestRun.id.toString());

      # ── 7. Download artifact from download workflow ────────
      - name: Download Booking Data Artifact
        uses: actions/download-artifact@v4
        with:
          name:         booking-data-latest
          path:         /tmp/artifact/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository:   ${{ github.repository }}
          run-id:       ${{ steps.find_run.outputs.run_id }}

      # ── 8. Restore file structure ──────────────────────────
      - name: Restore Downloaded Files
        run: |
          echo "📂 Artifact contents:"
          ls -la /tmp/artifact/

          # Restore booking downloads folder
          if [ -d "/tmp/artifact/booking_downloads" ]; then
            cp -r /tmp/artifact/booking_downloads/. /tmp/booking_downloads/
            echo "✅ Booking files restored:"
            ls -la /tmp/booking_downloads/
          else
            echo "❌ booking_downloads folder not found in artifact"
            echo "Available folders:"
            find /tmp/artifact/ -type f
            exit 1
          fi

          # Restore handoff.json
          if [ -f "/tmp/artifact/handoff.json" ]; then
            cp /tmp/artifact/handoff.json /tmp/handoff.json
            echo "✅ Handoff file restored:"
            cat /tmp/handoff.json
          else
            echo "❌ handoff.json not found in artifact"
            echo "Available files:"
            find /tmp/artifact/ -type f
            exit 1
          fi

      # ── 9. Run processor + emailer ─────────────────────────
      - name: Run Process and Email Step
        env:
          WISX_USER_ID:         ${{ secrets.WISX_USER_ID }}
          WISX_PASSWORD:        ${{ secrets.WISX_PASSWORD }}
          SMTP_SENDER_EMAIL:    ${{ secrets.SMTP_SENDER_EMAIL }}
          SMTP_SENDER_PASSWORD: ${{ secrets.SMTP_SENDER_PASSWORD }}
          EMAIL_LINKEDIN_TO:    ${{ secrets.EMAIL_LINKEDIN_TO }}
          EMAIL_LINKEDIN_CC:    ${{ secrets.EMAIL_LINKEDIN_CC }}
          EMAIL_BTC_TO:         ${{ secrets.EMAIL_BTC_TO }}
          EMAIL_BTC_CC:         ${{ secrets.EMAIL_BTC_CC }}
          EMAIL_NONBTC_TO:      ${{ secrets.EMAIL_NONBTC_TO }}
          EMAIL_NONBTC_CC:      ${{ secrets.EMAIL_NONBTC_CC }}
        run: python email_master.py

