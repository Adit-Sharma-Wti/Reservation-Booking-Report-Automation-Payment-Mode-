# ============================================================
# WORKFLOW 1 — DOWNLOAD BOOKING DATA
# .github/workflows/download.yml
# ============================================================

name: Download Booking Data

on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2t64 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libnss3 \
            libpango-1.0-0 \
            libcairo2
          playwright install chromium

      - name: Create Working Directories
        run: |
          mkdir -p /tmp/booking_downloads
          mkdir -p store

      - name: Run Download Step
        env:
          WISX_USER_ID:         ${{ secrets.WISX_USER_ID }}
          WISX_PASSWORD:        ${{ secrets.WISX_PASSWORD }}
          SMTP_SENDER_EMAIL:    ${{ secrets.SMTP_SENDER_EMAIL }}
          SMTP_SENDER_PASSWORD: ${{ secrets.SMTP_SENDER_PASSWORD }}
          EMAIL_LINKEDIN_TO:    ${{ secrets.EMAIL_LINKEDIN_TO }}
          EMAIL_LINKEDIN_CC:    ${{ secrets.EMAIL_LINKEDIN_CC }}
          EMAIL_BTC_TO:         ${{ secrets.EMAIL_BTC_TO }}
          EMAIL_BTC_CC:         ${{ secrets.EMAIL_BTC_CC }}
          EMAIL_NONBTC_TO:      ${{ secrets.EMAIL_NONBTC_TO }}
          EMAIL_NONBTC_CC:      ${{ secrets.EMAIL_NONBTC_CC }}
        run: python download_master.py

      - name: Upload Downloaded File as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: booking-data-latest
          path: |
            /tmp/booking_downloads/
            /tmp/handoff.json
          retention-days: 1
          overwrite: true
